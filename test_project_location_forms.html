<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Project Location Forms - BuildOptima</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">🗺️ Test Project Location Forms</h1>
        
        <div id="status" class="p-4 rounded-lg mb-6 info">
            Ready to test location input functionality...
        </div>

        <!-- Test Form -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Create Project with Location</h2>
            
            <form id="testForm">
                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Project Name *</label>
                    <input type="text" id="name" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Test Project">
                </div>
                
                <div class="mb-4">
                    <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                    <input type="text" id="location" name="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="e.g., Mumbai, Maharashtra">
                </div>
                
                <!-- Location Coordinates Section -->
                <div class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="flex items-center justify-between mb-3">
                        <label class="block text-sm font-medium text-gray-700">GPS Coordinates (Optional)</label>
                        <button type="button" id="get-location-btn" class="px-3 py-1 text-xs bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                            <svg class="w-3 h-3 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Get My Location
                        </button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="latitude" class="block text-xs font-medium text-gray-600 mb-1">Latitude</label>
                            <input type="number" id="latitude" name="latitude" step="0.000001" min="-90" max="90" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="e.g., 19.0760">
                        </div>
                        <div>
                            <label for="longitude" class="block text-xs font-medium text-gray-600 mb-1">Longitude</label>
                            <input type="number" id="longitude" name="longitude" step="0.000001" min="-180" max="180" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm" placeholder="e.g., 72.8777">
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">
                        💡 Tip: Use "Get My Location" or enter coordinates manually
                    </p>
                </div>
                
                <div class="mb-4">
                    <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="status" name="status" class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="Planning">Planning</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="On Hold">On Hold</option>
                    </select>
                </div>
                
                <div class="pt-4">
                    <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Create Test Project
                    </button>
                </div>
            </form>
        </div>

        <!-- Test Results -->
        <div id="results" class="mt-6 bg-white rounded-lg shadow-lg p-6 hidden">
            <h3 class="text-lg font-semibold mb-4">Test Results</h3>
            <pre id="results-content" class="bg-gray-100 p-4 rounded text-sm overflow-auto"></pre>
        </div>
    </div>

    <script>
        // Geolocation functionality
        function getCurrentLocation() {
            const button = document.getElementById('get-location-btn');
            const latField = document.getElementById('latitude');
            const lonField = document.getElementById('longitude');
            
            if (!navigator.geolocation) {
                showMessage('❌ Geolocation is not supported by this browser.', 'error');
                return;
            }
            
            // Show loading state
            const originalText = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<svg class="w-3 h-3 inline mr-1 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>Getting Location...';
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // Success - populate the fields
                    latField.value = position.coords.latitude.toFixed(6);
                    lonField.value = position.coords.longitude.toFixed(6);
                    
                    // Reset button
                    button.disabled = false;
                    button.innerHTML = originalText;
                    
                    showMessage('✅ Location obtained successfully!', 'success');
                },
                function(error) {
                    // Error handling
                    let errorMessage = 'Unable to get location: ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage += 'Location access denied by user.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage += 'Location information unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMessage += 'Location request timed out.';
                            break;
                        default:
                            errorMessage += 'Unknown error occurred.';
                            break;
                    }
                    
                    // Reset button
                    button.disabled = false;
                    button.innerHTML = originalText;
                    
                    showMessage('❌ ' + errorMessage, 'error');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 300000 // 5 minutes
                }
            );
        }

        function showMessage(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `p-4 rounded-lg mb-6 ${type}`;
            statusDiv.textContent = message;
        }

        // Form submission
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {};
            
            // Convert form data to object
            formData.forEach((value, key) => {
                if (key === 'latitude' || key === 'longitude') {
                    data[key] = value ? parseFloat(value) : null;
                } else {
                    data[key] = value.trim() === '' ? null : value.trim();
                }
            });
            
            showMessage('🔄 Creating project...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: `HTTP error ${response.status}` }));
                    throw new Error(errorData.detail || `Error ${response.status}`);
                }
                
                const result = await response.json();
                
                showMessage('✅ Project created successfully!', 'success');
                
                // Show results
                document.getElementById('results').classList.remove('hidden');
                document.getElementById('results-content').textContent = JSON.stringify(result, null, 2);
                
                // Reset form
                this.reset();
                
            } catch (error) {
                showMessage('❌ Error creating project: ' + error.message, 'error');
                console.error('Error:', error);
            }
        });

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('get-location-btn').addEventListener('click', getCurrentLocation);
        });
    </script>
</body>
</html>
