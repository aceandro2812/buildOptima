<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js Loading Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Chart.js Loading Test</h1>
        
        <div id="status" class="mb-4 p-4 rounded bg-yellow-100 text-yellow-800">
            Testing Chart.js loading...
        </div>
        
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold mb-4">Test Chart</h3>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="test-chart"></canvas>
            </div>
        </div>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>

    <script>
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const colors = {
                success: 'bg-green-100 text-green-800',
                error: 'bg-red-100 text-red-800',
                info: 'bg-blue-100 text-blue-800'
            };
            statusDiv.className = `mb-4 p-4 rounded ${colors[type]}`;
            statusDiv.textContent = message;
        }

        function testChartLoading() {
            updateStatus('Checking if Chart.js is loaded...', 'info');
            
            if (typeof Chart === 'undefined') {
                updateStatus('❌ Chart.js not loaded! CDN might be blocked or slow.', 'error');
                return false;
            }
            
            updateStatus('✅ Chart.js loaded successfully!', 'success');
            
            try {
                // Test creating a chart
                const ctx = document.getElementById('test-chart').getContext('2d');
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Test 1', 'Test 2', 'Test 3'],
                        datasets: [{
                            label: 'Test Data',
                            data: [12, 19, 3],
                            backgroundColor: 'rgba(59, 130, 246, 0.5)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
                
                updateStatus('✅ Chart created successfully! Chart.js is working properly.', 'success');
                return true;
                
            } catch (error) {
                updateStatus(`❌ Error creating chart: ${error.message}`, 'error');
                return false;
            }
        }

        // Test immediately
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(testChartLoading, 100);
            });
        } else {
            setTimeout(testChartLoading, 100);
        }

        // Also test after a delay to catch slow loading
        setTimeout(function() {
            if (typeof Chart === 'undefined') {
                updateStatus('❌ Chart.js still not loaded after 2 seconds. Check network connection.', 'error');
            }
        }, 2000);
    </script>
</body>
</html>
