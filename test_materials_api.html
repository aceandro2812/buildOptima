<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Materials API Test</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Test GET Materials -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">GET Materials</h2>
                <button onclick="testGetMaterials()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Test GET /api/materials
                </button>
                <div id="get-result" class="mt-4 p-3 bg-gray-50 rounded text-sm overflow-auto max-h-40"></div>
            </div>

            <!-- Test POST Material -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">POST Material</h2>
                <button onclick="testPostMaterial()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Test POST /api/materials
                </button>
                <div id="post-result" class="mt-4 p-3 bg-gray-50 rounded text-sm overflow-auto max-h-40"></div>
            </div>

            <!-- Test Projects -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">GET Projects</h2>
                <button onclick="testGetProjects()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    Test GET /api/projects
                </button>
                <div id="projects-result" class="mt-4 p-3 bg-gray-50 rounded text-sm overflow-auto max-h-40"></div>
            </div>

            <!-- Test Suppliers -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">GET Suppliers</h2>
                <button onclick="testGetSuppliers()" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    Test GET /api/suppliers
                </button>
                <div id="suppliers-result" class="mt-4 p-3 bg-gray-50 rounded text-sm overflow-auto max-h-40"></div>
            </div>
        </div>

        <div class="mt-8 bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Test Results Summary</h2>
            <div id="summary" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let testResults = [];

        function logResult(test, success, data) {
            testResults.push({ test, success, data, timestamp: new Date().toLocaleTimeString() });
            updateSummary();
        }

        function updateSummary() {
            const summary = document.getElementById('summary');
            summary.innerHTML = '';
            
            testResults.forEach(result => {
                const div = document.createElement('div');
                div.className = `p-2 rounded ${result.success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
                div.innerHTML = `
                    <span class="font-medium">[${result.timestamp}]</span> 
                    ${result.test}: ${result.success ? '✅ Success' : '❌ Failed'}
                    ${result.data ? `- ${result.data}` : ''}
                `;
                summary.appendChild(div);
            });
        }

        async function testGetMaterials() {
            const resultDiv = document.getElementById('get-result');
            resultDiv.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/materials');
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Count:</strong> ${data.length} materials<br>
                        <strong>Sample:</strong> ${JSON.stringify(data.slice(0, 2), null, 2)}
                    `;
                    logResult('GET Materials', true, `Found ${data.length} materials`);
                } else {
                    resultDiv.textContent = `Error: ${response.status} - ${JSON.stringify(data)}`;
                    logResult('GET Materials', false, `HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                logResult('GET Materials', false, error.message);
            }
        }

        async function testPostMaterial() {
            const resultDiv = document.getElementById('post-result');
            resultDiv.textContent = 'Testing...';
            
            // First get a project ID
            try {
                const projectsResponse = await fetch('/api/projects');
                const projects = await projectsResponse.json();
                
                if (!projects.length) {
                    resultDiv.textContent = 'Error: No projects found. Create a project first.';
                    logResult('POST Material', false, 'No projects available');
                    return;
                }

                const testMaterial = {
                    material_name: `Test Material ${Date.now()}`,
                    project_id: projects[0].id,
                    quantity: 100.5,
                    unit: 'kg',
                    reorder_point: 20.0,
                    estimated_quantity: 100.0,
                    estimated_unit_price: 50.0,
                    description: 'Test material created by API test'
                };

                const response = await fetch('/api/materials', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testMaterial)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Created:</strong> ${data.material_name}<br>
                        <strong>ID:</strong> ${data.id}<br>
                        <strong>Project:</strong> ${data.project_name}
                    `;
                    logResult('POST Material', true, `Created "${data.material_name}"`);
                } else {
                    resultDiv.textContent = `Error: ${response.status} - ${JSON.stringify(data)}`;
                    logResult('POST Material', false, `HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                logResult('POST Material', false, error.message);
            }
        }

        async function testGetProjects() {
            const resultDiv = document.getElementById('projects-result');
            resultDiv.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Count:</strong> ${data.length} projects<br>
                        <strong>Projects:</strong> ${data.map(p => p.name).join(', ')}
                    `;
                    logResult('GET Projects', true, `Found ${data.length} projects`);
                } else {
                    resultDiv.textContent = `Error: ${response.status} - ${JSON.stringify(data)}`;
                    logResult('GET Projects', false, `HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                logResult('GET Projects', false, error.message);
            }
        }

        async function testGetSuppliers() {
            const resultDiv = document.getElementById('suppliers-result');
            resultDiv.textContent = 'Loading...';
            
            try {
                const response = await fetch('/api/suppliers');
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Count:</strong> ${data.length} suppliers<br>
                        <strong>Suppliers:</strong> ${data.map(s => s.name).join(', ')}
                    `;
                    logResult('GET Suppliers', true, `Found ${data.length} suppliers`);
                } else {
                    resultDiv.textContent = `Error: ${response.status} - ${JSON.stringify(data)}`;
                    logResult('GET Suppliers', false, `HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                logResult('GET Suppliers', false, error.message);
            }
        }

        // Auto-run tests on page load
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                testGetProjects();
                setTimeout(() => testGetSuppliers(), 500);
                setTimeout(() => testGetMaterials(), 1000);
            }, 500);
        });
    </script>
</body>
</html>
