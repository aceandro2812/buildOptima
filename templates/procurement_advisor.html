{%- extends "base.html" -%}
{%- block title -%}Procurement Advisor - BuildOptima{%- endblock -%}

{%- block content -%}
<div class="container mx-auto p-6">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold">Procurement Advisor</h1>
    <div>
      <label for="project-select" class="mr-2">Project:</label>
      <select id="project-select" class="p-2 border rounded">
        <option value="">Select project</option>
        {% for p in projects %}
        <option value="{{ p.id }}">{{ p.name }}</option>
        {% endfor %}
      </select>
      <button onclick="runFullPageProcurement()" class="ml-3 px-4 py-2 bg-green-600 text-white rounded">Run</button>
    </div>
  </div>

  <div id="advisor-results" class="space-y-4">
    <p class="text-sm text-gray-600">No results yet. Choose a project and click Run.</p>
  </div>
</div>

<script>
async function runFullPageProcurement(){
  const sel = document.getElementById('project-select');
  const pid = sel.value;
  if(!pid){ alert('Select a project'); return; }
  const container = document.getElementById('advisor-results');
  container.innerHTML = '<p class="text-sm text-gray-600">Generating recommendations — please wait...</p>';
  try {
    const resp = await fetch(`/api/ai/procurement?project_id=${pid}`);
    if(!resp.ok){
      container.innerHTML = '<div class="text-red-600">Failed to fetch recommendations: ' + await resp.text() + '</div>';
      return;
    }
    const data = await resp.json();
    if(!data.suggestions || data.suggestions.length===0){
      container.innerHTML = '<div class="p-3 text-sm text-gray-600">No suggestions available.</div>';
      return;
    }
    let html = '';
    for(const s of data.suggestions){
      html += `<div class="border rounded p-3">
        <div class="flex justify-between items-center"><strong>${s.material_name}</strong><span>Current: ${s.current_quantity}</span></div>
        <div class="mt-2 text-sm">Recommendation: <strong>${s.recommended_order_qty ?? '—'}</strong></div>
        <div class="text-xs text-gray-600 mt-1">${s.reason}</div>
        <div class="mt-2 text-sm"><em>AI explanation:</em><div class="mt-1 text-sm text-gray-800">${s.ai_explanation || ''}</div></div>
      </div>`;
    }
    container.innerHTML = html;
  } catch(err){
    container.innerHTML = '<div class="text-red-600">Error: '+err.toString()+'</div>';
  }
}
</script>
{%- endblock -%}
